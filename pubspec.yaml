name: ai_household_app
description: AI Household app for recognizing household appliance control panels with camera and Gemini Vision.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  http: ^1.3.0
  shared_preferences: ^2.3.3
  flutter_tts: ^4.2.2
  image: ^4.5.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
